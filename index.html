<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galería Virtual Nebulosa</title>
  
  <!-- Fuente oficial Poppins -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.2.0/dist/aframe-extras.min.js"></script>

  <style>
    /* CURSOR DE MANITA ABIERTA / CERRADA PARA ARRASTRE */
    html, body, canvas.a-canvas, a-scene {
      cursor: grab !important;
      cursor: -webkit-grab !important;
      user-select: none;
    }
    body:active, canvas.a-canvas:active, a-scene:active {
      cursor: grabbing !important;
      cursor: -webkit-grabbing !important;
    }

    /* MODAL DE INFORMACIÓN ESTILO ARTSTEPS / NEBULOSA */
    #artwork-modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(10, 8, 18, 0.65);
      backdrop-filter: blur(8px);
      z-index: 10000000;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    #artwork-modal {
      background: linear-gradient(145deg, rgba(28, 20, 48, 0.95), rgba(16, 12, 28, 0.95));
      border: 1px solid rgba(192, 132, 252, 0.35);
      border-radius: 20px;
      padding: 28px 24px 24px;
      max-width: 440px;
      width: 100%;
      color: #ffffff;
      font-family: 'Poppins', sans-serif;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7), 0 0 30px rgba(168, 85, 247, 0.25);
      position: relative;
      animation: modalFadeIn 0.22s ease-out;
      user-select: text;
      cursor: default;
    }
    @keyframes modalFadeIn {
      from { opacity: 0; transform: scale(0.92) translateY(12px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }
    #artwork-modal-close {
      position: absolute;
      top: 14px;
      right: 16px;
      width: 32px;
      height: 32px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 50%;
      color: #e9d5ff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    #artwork-modal-close:hover {
      background: rgba(239, 68, 68, 0.3);
      color: #ffffff;
      border-color: #ef4444;
    }
    #artwork-modal-badge {
      display: inline-block;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: #c084fc;
      background: rgba(192, 132, 252, 0.15);
      border: 1px solid rgba(192, 132, 252, 0.3);
      border-radius: 12px;
      padding: 3px 10px;
      margin-bottom: 10px;
      font-weight: 600;
    }
    #artwork-modal-title {
      font-size: 20px;
      font-weight: 700;
      margin: 0 0 10px 0;
      color: #ffffff;
      line-height: 1.3;
    }
    #artwork-modal-desc {
      font-size: 13px;
      line-height: 1.6;
      color: #d8b4fe;
      margin: 0 0 20px 0;
    }
    #artwork-modal-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      box-sizing: border-box;
      background: linear-gradient(135deg, #7c3aed, #a855f7);
      color: #ffffff;
      text-decoration: none;
      padding: 11px 18px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      transition: all 0.2s ease;
      box-shadow: 0 6px 18px rgba(124, 58, 237, 0.45);
    }
    #artwork-modal-link:hover {
      background: linear-gradient(135deg, #6d28d9, #9333ea);
      transform: translateY(-1px);
    }

    /* PANEL DE INSTRUCCIONES Y FLECHAS DE MOVIMIENTO EN PANTALLA */
    #nav-guide {
      position: fixed;
      top: 50%;
      transform: translateY(-50%);
      right: 20px;
      background: rgba(14, 14, 20, 0.90);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 16px;
      padding: 16px 14px;
      color: #ffffff;
      font-family: 'Poppins', sans-serif;
      z-index: 9999999 !important;
      box-shadow: 0 12px 36px rgba(0,0,0,0.6);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      user-select: none;
      cursor: default !important;
    }

    .guide-title {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1.2px;
      color: #9c9cb8;
      font-weight: 700;
    }

    .arrow-pad {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
    }
    .arrow-row {
      display: flex;
      gap: 5px;
    }
    .key-cap {
      width: 34px;
      height: 34px;
      background: #252535;
      border: 1px solid #404058;
      border-bottom: 3px solid #161622;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      font-weight: 600;
      font-family: 'Poppins', sans-serif;
      color: #f5f5fa;
      cursor: pointer !important;
      transition: all 0.1s ease;
    }
    .key-cap:hover {
      background: #3b3b54;
      border-color: #6366f1;
    }
    .key-cap:active {
      transform: translateY(2px);
      border-bottom-width: 1px;
    }

    .guide-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      font-size: 11px;
      text-align: center;
      color: #dcdcfa;
      gap: 6px;
    }

    .mouse-icon {
      width: 22px;
      height: 30px;
      border: 2px solid #ffffff;
      border-radius: 13px;
      position: relative;
    }
    .mouse-icon::after {
      content: '';
      position: absolute;
      top: 5px;
      left: 50%;
      transform: translateX(-50%);
      width: 2px;
      height: 7px;
      background: #ffffff;
      border-radius: 2px;
    }

    /* BOTÓN DIRECTO PARA ABRIR EL EDITOR 3D */
    .btn-editor {
      background: linear-gradient(135deg, #7c3aed, #a855f7);
      color: #ffffff;
      border: none;
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 11px;
      font-weight: 600;
      font-family: 'Poppins', sans-serif;
      cursor: pointer !important;
      box-shadow: 0 4px 12px rgba(124, 58, 237, 0.4);
      transition: all 0.2s ease;
    }
    .btn-editor:hover {
      background: linear-gradient(135deg, #6d28d9, #9333ea);
      transform: scale(1.04);
    }

    /* PESTAÑAS FLOTANTES DE FLECHAS PARA MINIMIZAR PANELES */
    .toggle-panel-btn {
      position: fixed !important;
      top: 50% !important;
      transform: translateY(-50%) !important;
      background: #7c3aed !important;
      color: #ffffff !important;
      border: 2px solid rgba(255, 255, 255, 0.5) !important;
      border-radius: 8px !important;
      width: 26px !important;
      height: 52px !important;
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
      cursor: pointer !important;
      z-index: 99999999 !important;
      font-size: 15px !important;
      font-weight: 900 !important;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.6) !important;
      transition: left 0.2s ease, right 0.2s ease, transform 0.15s ease !important;
      user-select: none !important;
    }
    .toggle-panel-btn:hover {
      background: #9333ea !important;
      transform: translateY(-50%) scale(1.08) !important;
    }

    /* BOTÓN SUPERIOR DE GUARDADO */
    #custom-save-bar {
      position: fixed !important;
      top: 6px !important;
      left: 175px !important;
      z-index: 99999999 !important;
      display: flex !important;
      align-items: center !important;
      gap: 10px !important;
    }
    .btn-guardar-real {
      background: #10b981 !important;
      color: #ffffff !important;
      border: none !important;
      border-radius: 6px !important;
      padding: 6px 14px !important;
      font-size: 12px !important;
      font-weight: 700 !important;
      font-family: 'Poppins', sans-serif !important;
      cursor: pointer !important;
      box-shadow: 0 4px 14px rgba(16, 185, 129, 0.5) !important;
      transition: all 0.2s ease !important;
    }
    .btn-guardar-real:hover {
      background: #059669 !important;
      transform: scale(1.04) !important;
    }
  </style>

  <script>
    function activarEditorVisual() {
      if (window.AFRAME && window.AFRAME.INSPECTOR) {
        window.AFRAME.INSPECTOR.open();
      } else {
        window.postMessage('INJECT_AFRAME_INSPECTOR', '*');
      }
    }

    function abrirModalObra(titulo, desc, link) {
      if (document.querySelector('#aframeInspector, [data-aframe-inspector]')) return;
      document.getElementById('artwork-modal-title').textContent = titulo || 'Obra';
      document.getElementById('artwork-modal-desc').textContent = desc || 'Descripción disponible próximamente.';
      const btnLink = document.getElementById('artwork-modal-link');
      btnLink.href = link || 'https://galerianebulosa.com/obras-destacadas/';
      btnLink.target = '_blank';
      document.getElementById('artwork-modal-overlay').style.display = 'flex';
    }

    function cerrarModalObra() {
      document.getElementById('artwork-modal-overlay').style.display = 'none';
    }

    function moverConBoton(tecla) {
      const cameraRig = document.querySelector('#rig');
      if (cameraRig) {
        const rot = cameraRig.getAttribute('rotation') || { y: 0 };
        const rad = THREE.MathUtils.degToRad(rot.y);
        const paso = 0.8;
        let dx = 0, dz = 0;

        if (tecla === 'ArrowUp') {
          dx = -Math.sin(rad) * paso;
          dz = -Math.cos(rad) * paso;
        } else if (tecla === 'ArrowDown') {
          dx = Math.sin(rad) * paso;
          dz = Math.cos(rad) * paso;
        } else if (tecla === 'ArrowLeft') {
          dx = -Math.cos(rad) * paso;
          dz = Math.sin(rad) * paso;
        } else if (tecla === 'ArrowRight') {
          dx = Math.cos(rad) * paso;
          dz = -Math.sin(rad) * paso;
        }

        const p = cameraRig.getAttribute('position');
        cameraRig.setAttribute('position', { x: p.x + dx, y: p.y, z: p.z + dz });
      }

      if (window.AFRAME && window.AFRAME.INSPECTOR && window.AFRAME.INSPECTOR.camera) {
        const cam = window.AFRAME.INSPECTOR.camera;
        const pasoInspector = 0.8;
        if (tecla === 'ArrowUp') cam.translateZ(-pasoInspector);
        if (tecla === 'ArrowDown') cam.translateZ(pasoInspector);
        if (tecla === 'ArrowLeft') cam.translateX(-pasoInspector);
        if (tecla === 'ArrowRight') cam.translateX(pasoInspector);
      }

      window.dispatchEvent(new KeyboardEvent('keydown', { key: tecla, code: tecla, bubbles: true }));
    }

    setInterval(() => {
      const leftSidebar = document.querySelector('#scenegraph, .scenegraph');
      const rightSidebar = document.querySelector('#rightPanel, #sidebar, .components');
      const inspectorActivo = document.querySelector('#aframeInspector, [data-aframe-inspector]');

      if (leftSidebar || rightSidebar || inspectorActivo) {
        const iconSave = document.querySelector('.fa-save');
        if (iconSave && !iconSave.dataset.customized) {
          iconSave.dataset.customized = "true";
          iconSave.onclick = (e) => {
            e.preventDefault();
            e.stopPropagation();
            guardarHtmlActualizado();
          };
        }

        if (!document.getElementById('custom-save-bar')) {
          const bar = document.createElement('div');
          bar.id = 'custom-save-bar';
          bar.innerHTML = `<button class="btn-guardar-real" onclick="guardarHtmlActualizado()">💾 GUARDAR CAMBIOS</button>`;
          document.body.appendChild(bar);
        }

        if (leftSidebar && !document.getElementById('btn-min-left')) {
          const btnL = document.createElement('div');
          btnL.id = 'btn-min-left';
          btnL.className = 'toggle-panel-btn';
          btnL.style.left = '232px';
          btnL.innerHTML = '◀';
          btnL.title = 'Minimizar / Mostrar panel izquierdo';
          let ocultoL = false;
          btnL.onclick = () => {
            ocultoL = !ocultoL;
            leftSidebar.style.setProperty('display', ocultoL ? 'none' : 'flex', 'important');
            btnL.style.left = ocultoL ? '4px' : '232px';
            btnL.innerHTML = ocultoL ? '▶' : '◀';
          };
          document.body.appendChild(btnL);
        }

        if (rightSidebar && !document.getElementById('btn-min-right')) {
          const btnR = document.createElement('div');
          btnR.id = 'btn-min-right';
          btnR.className = 'toggle-panel-btn';
          btnR.style.right = '332px';
          btnR.innerHTML = '▶';
          btnR.title = 'Minimizar / Mostrar panel derecho';
          let ocultoR = false;
          btnR.onclick = () => {
            ocultoR = !ocultoR;
            rightSidebar.style.setProperty('display', ocultoR ? 'none' : 'flex', 'important');
            btnR.style.right = ocultoR ? '4px' : '332px';
            btnR.innerHTML = ocultoR ? '◀' : '▶';
          };
          document.body.appendChild(btnR);
        }
      }
    }, 600);

    // FUNCIÓN DE GUARDADO DIRECTO DESDE EL MOTOR 3D
    function guardarHtmlActualizado() {
      let reporte = "Coordenadas guardadas:\n";

      const elementosAGuardar = [
        'rotulo-exterior',
        'grupo-1-cuadro-honor', 'grupo-1-obra-1', 'grupo-1-obra-2', 'grupo-1-obra-3',
        'obra-4', 'obra-5', 'obra-6',
        'grupo-3-obra-7', 'grupo-3-obra-8', 'grupo-3-obra-9',
        'grupo-4-obra-10', 'grupo-4-obra-11', 'grupo-4-obra-12', 'grupo-4-obra-13', 'grupo-4-obra-14', 'grupo-4-obra-15', 'grupo-4-obra-16',
        'grupo-5-obra-17', 'grupo-5-obra-18', 'grupo-5-obra-19', 'grupo-5-obra-20', 'grupo-5-obra-21', 'grupo-5-obra-22', 'grupo-5-obra-23', 'grupo-5-obra-24', 'grupo-5-obra-25',
        'grupo-5-obra-26', 'grupo-5-obra-27', 'grupo-5-obra-28', 'grupo-5-obra-29', 'grupo-5-obra-30'
      ];

      elementosAGuardar.forEach(id => {
        const entidad = document.getElementById(id);
        if (entidad) {
          let x, y, z;
          if (entidad.object3D) {
            x = entidad.object3D.position.x;
            y = entidad.object3D.position.y;
            z = entidad.object3D.position.z;
          } else {
            const p = entidad.getAttribute('position');
            x = p.x; y = p.y; z = p.z;
          }

          const posFinal = `${x.toFixed(2)} ${y.toFixed(2)} ${z.toFixed(2)}`;
          entidad.setAttribute('position', posFinal);
          reporte += `• ${id}: ${posFinal}\n`;
        }
      });

      const clonDoc = document.documentElement.cloneNode(true);
      const elementosParaRemover = clonDoc.querySelectorAll(
        '#aframeInspector, #custom-save-bar, #btn-min-left, #btn-min-right, .inspector-toggle-btn, #btn-guardar-inspector, [data-aframe-inspector]'
      );
      elementosParaRemover.forEach(el => el.remove());

      clonDoc.classList.remove('a-fullscreen');
      const bodyClon = clonDoc.querySelector('body');
      if (bodyClon) bodyClon.className = '';

      const htmlCompleto = '<!DOCTYPE html>\n' + clonDoc.outerHTML;
      const blob = new Blob([htmlCompleto], { type: 'text/html;charset=utf-8' });
      const enlace = document.createElement('a');
      enlace.href = URL.createObjectURL(blob);
      enlace.download = 'index.html';
      enlace.click();

      alert("✅ ¡Cambios guardados con éxito!\n\n" + reporte + "\nReemplaza este archivo en GitHub.");
    }

    // COMPONENTE DE INTERACCIÓN POR CLIC DIRECTO
    AFRAME.registerComponent('obra-interactiva', {
      schema: {
        titulo: { type: 'string', default: '' },
        desc: { type: 'string', default: '' },
        link: { type: 'string', default: 'https://galerianebulosa.com/obras-destacadas/' }
      },
      init: function () {
        const el = this.el;
        const data = this.data;

        const vincularClic = (target) => {
          target.classList.add('clickable');
          target.addEventListener('click', (e) => {
            e.stopPropagation();
            abrirModalObra(data.titulo, data.desc, data.link);
          });
        };

        vincularClic(el);
        el.querySelectorAll('a-plane, a-box').forEach(vincularClic);
      }
    });

    AFRAME.registerComponent('lienzo-obra', {
      schema: {
        titulo: { type: 'string', default: 'OBRA DISPONIBLE' },
        subtitulo: { type: 'string', default: 'Galería Nebulosa' },
        src: { type: 'string', default: '' }
      },
      init: function () {
        const el = this.el;
        const data = this.data;

        const aplicarTextura = (texture) => {
          texture.colorSpace = THREE.SRGBColorSpace;
          const mesh = el.getObject3D('mesh');
          if (mesh) {
            mesh.material = new THREE.MeshBasicMaterial({ 
              map: texture, 
              side: THREE.DoubleSide 
            });
            mesh.material.needsUpdate = true;
          }
        };

        if (data.src && data.src.trim() !== '') {
          const loader = new THREE.TextureLoader();
          loader.setCrossOrigin('anonymous');
          loader.load(
            data.src,
            function (tex) { aplicarTextura(tex); },
            undefined,
            function () { console.warn("Error cargando imagen: " + data.src); }
          );
          return;
        }

        const canvas = document.createElement('canvas');
        canvas.width = 1024;
        canvas.height = 720;
        const ctx = canvas.getContext('2d');

        const grad = ctx.createLinearGradient(0, 0, 1024, 720);
        grad.addColorStop(0, '#221538');
        grad.addColorStop(0.5, '#161026');
        grad.addColorStop(1, '#0c0a15');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.strokeStyle = '#c084fc';
        ctx.lineWidth = 8;
        ctx.strokeRect(30, 30, canvas.width - 60, canvas.height - 60);

        ctx.fillStyle = '#ffffff';
        ctx.font = "bold 52px 'Poppins', sans-serif";
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(data.titulo, canvas.width / 2, canvas.height / 2 - 35);

        ctx.fillStyle = '#e9d5ff';
        ctx.font = "400 30px 'Poppins', sans-serif";
        ctx.fillText(data.subtitulo, canvas.width / 2, canvas.height / 2 + 45);

        const texture = new THREE.CanvasTexture(canvas);
        aplicarTextura(texture);
      }
    });

    AFRAME.registerComponent('cuadro-ganador', {
      schema: {
        titulo: { type: 'string', default: 'GANADORES DE LOS PRIMEROS LUGARES' },
        nombre: { type: 'string', default: 'Artistas Galardonados' }
      },
      init: function () {
        const el = this.el;
        const data = this.data;

        const canvas = document.createElement('canvas');
        canvas.width = 720;
        canvas.height = 1024;
        const ctx = canvas.getContext('2d');

        const fondo = ctx.createLinearGradient(0, 0, 720, 1024);
        fondo.addColorStop(0, '#2e1845');
        fondo.addColorStop(0.5, '#201230');
        fondo.addColorStop(1, '#170c24');
        ctx.fillStyle = fondo;
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.strokeStyle = '#f59e0b';
        ctx.lineWidth = 14;
        ctx.strokeRect(20, 20, canvas.width - 40, canvas.height - 40);

        ctx.strokeStyle = '#fbbf24';
        ctx.lineWidth = 4;
        ctx.strokeRect(40, 40, canvas.width - 80, canvas.height - 80);

        ctx.fillStyle = '#fbbf24';
        ctx.font = "bold 44px sans-serif";
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText("★   ★   ★", canvas.width / 2, 130);

        ctx.font = "bold 24px 'Poppins', sans-serif";
        ctx.fillStyle = "#fef3c7";
        ctx.fillText("RECONOCIMIENTO DE HONOR", canvas.width / 2, 210);

        ctx.beginPath();
        ctx.moveTo(120, 250);
        ctx.lineTo(600, 250);
        ctx.strokeStyle = '#f59e0b';
        ctx.lineWidth = 3;
        ctx.stroke();

        ctx.fillStyle = '#ffffff';
        ctx.font = "bold 30px 'Poppins', sans-serif";
        ctx.fillText("GANADORES DE LOS", canvas.width / 2, 335);
        ctx.font = "bold 34px 'Poppins', sans-serif";
        ctx.fillText("PRIMEROS LUGARES", canvas.width / 2, 380);

        ctx.font = "bold 105px sans-serif";
        ctx.fillStyle = '#fbbf24';
        ctx.fillText("★", canvas.width / 2, 510);

        ctx.fillStyle = '#fef08a';
        ctx.font = "bold 44px 'Poppins', sans-serif";
        ctx.fillText(data.nombre, canvas.width / 2, 650);

        ctx.fillStyle = '#e2e8f0';
        ctx.font = "400 26px 'Poppins', sans-serif";
        ctx.fillText("Galería Nebulosa", canvas.width / 2, 740);

        ctx.fillStyle = '#fbbf24';
        ctx.font = "bold 32px sans-serif";
        ctx.fillText("✦   ★   ✦", canvas.width / 2, 880);

        const texture = new THREE.CanvasTexture(canvas);
        texture.colorSpace = THREE.SRGBColorSpace;
        const mesh = el.getObject3D('mesh');
        if (mesh) {
          mesh.material = new THREE.MeshBasicMaterial({ 
            map: texture, 
            side: THREE.DoubleSide 
          });
          mesh.material.needsUpdate = true;
        }
      }
    });

    AFRAME.registerComponent('enhancer', {
      init: function () {
        this.el.addEventListener('model-loaded', () => {
          const mesh = this.el.getObject3D('mesh');
          if (!mesh) return;

          const objetosParaEliminar = [];

          mesh.traverse((node) => {
            const matName = node.material && node.material.name ? node.material.name.toLowerCase() : "";
            const objName = node.name ? node.name.toLowerCase() : "";
            const combined = objName + " " + matName;

            const esVegetacion = combined.includes('plant') || combined.includes('leaf') || 
                                 combined.includes('leaves') || combined.includes('hoja') || 
                                 combined.includes('pot') || combined.includes('maceta') || 
                                 combined.includes('tree') || combined.includes('foliage') || 
                                 combined.includes('flora') || combined.includes('flower') || 
                                 combined.includes('branch') || combined.includes('vase');

            let tieneColorPlanta = false;
            if (node.material && node.material.color) {
              const c = node.material.color;
              if (c.g > 0.18 && c.g > c.r * 1.15 && c.g > c.b * 1.05) {
                tieneColorPlanta = true;
              }
            }

            if (esVegetacion || tieneColorPlanta) {
              objetosParaEliminar.push(node);
            }

            if (node.isMesh && node.material) {
              if (combined.includes('glass') || combined.includes('window') || combined.includes('vidrio') || combined.includes('cristal') || combined.includes('panel')) {
                node.material.color = new THREE.Color(0x22222b);
                node.material.transparent = true;
                node.material.opacity = 0.52;
                node.material.roughness = 0.20;
                node.material.metalness = 0.15;
                node.material.depthWrite = false;
              } 
              else if (combined.includes('light') || combined.includes('foco') || combined.includes('lamp') || combined.includes('spot') || combined.includes('bulb')) {
                node.material.emissive = new THREE.Color(0xffeedd);
                node.material.emissiveIntensity = 4.0;
              } 
              else if (combined.includes('floor') || combined.includes('suelo') || combined.includes('piso')) {
                node.material.color = new THREE.Color(0xd0d4de);
                node.material.roughness = 0.25;
                node.material.metalness = 0.08;
              } 
              else if (combined.includes('wall') || combined.includes('pared') || combined.includes('muro')) {
                node.material.color = new THREE.Color(0x584b70);
                node.material.roughness = 0.88;
                node.material.metalness = 0.02;
              }
              node.material.needsUpdate = true;
            }
          });

          objetosParaEliminar.forEach((obj) => {
            obj.visible = false;
            obj.scale.set(0, 0, 0);
            if (obj.geometry) obj.geometry.dispose();
            if (obj.parent) obj.parent.remove(obj);
          });
        });
      }
    });

    AFRAME.registerComponent('rotulo-poppins', {
      init: function () {
        document.fonts.ready.then(() => {
          const canvas = document.createElement('canvas');
          canvas.width = 1024;
          canvas.height = 256;
          const ctx = canvas.getContext('2d');

          ctx.fillStyle = "rgba(18, 16, 30, 0.95)";
          ctx.fillRect(0, 0, canvas.width, canvas.height);

          ctx.strokeStyle = "rgba(230, 220, 255, 0.35)";
          ctx.lineWidth = 6;
          ctx.strokeRect(10, 10, canvas.width - 20, canvas.height - 20);

          ctx.font = "600 48px 'Poppins', sans-serif";
          ctx.fillStyle = "#ffffff";
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          ctx.fillText("«Donde cada arte brilla»", canvas.width / 2, canvas.height / 2);

          const texture = new THREE.CanvasTexture(canvas);
          const mat = new THREE.MeshBasicMaterial({ 
            map: texture, 
            transparent: true, 
            side: THREE.DoubleSide 
          });
          const mesh = this.el.getObject3D('mesh');
          if (mesh) mesh.material = mat;
        });
      }
    });

    AFRAME.registerComponent('video-handler', {
      init: function () {
        const video = document.querySelector('#video-nebulosa');
        if (!video) return;

        video.playbackRate = 1.0;

        const startVideo = () => {
          if (video.paused) {
            video.playbackRate = 1.0;
            video.play().catch(() => {});
          }
          window.removeEventListener('click', startVideo);
          window.removeEventListener('keydown', startVideo);
        };
        window.addEventListener('click', startVideo);
        window.addEventListener('keydown', startVideo);
      }
    });
  </script>
