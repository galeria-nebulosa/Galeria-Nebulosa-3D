<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galería Virtual Nebulosa</title>
  
  <!-- Fuente oficial Poppins -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.2.0/dist/aframe-extras.min.js"></script>

  <style>
    /* CURSOR DE MANITA ABIERTA / CERRADA PARA ARRASTRE */
    html, body, canvas.a-canvas, a-scene {
      cursor: grab !important;
      cursor: -webkit-grab !important;
      user-select: none;
    }
    body:active, canvas.a-canvas:active, a-scene:active {
      cursor: grabbing !important;
      cursor: -webkit-grabbing !important;
    }

    /* PANEL DE INSTRUCCIONES VERTICAL DERECHO */
    #nav-guide {
      position: absolute;
      top: 50%;
      right: 20px;
      transform: translateY(-50%);
      background: rgba(14, 14, 20, 0.85);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 16px;
      padding: 20px 14px;
      color: #ffffff;
      font-family: 'Poppins', sans-serif;
      z-index: 1000;
      box-shadow: 0 12px 36px rgba(0,0,0,0.5);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      user-select: none;
      cursor: default !important;
    }

    .guide-title {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1.2px;
      color: #9c9cb8;
      font-weight: 700;
    }

    .arrow-pad {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
    }
    .arrow-row {
      display: flex;
      gap: 5px;
    }
    .key-cap {
      width: 32px;
      height: 32px;
      background: #252535;
      border: 1px solid #404058;
      border-bottom: 3px solid #161622;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 600;
      font-family: 'Poppins', sans-serif;
      color: #f5f5fa;
    }

    .guide-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      font-size: 11px;
      text-align: center;
      color: #dcdcfa;
      gap: 6px;
    }

    .mouse-icon {
      width: 22px;
      height: 30px;
      border: 2px solid #ffffff;
      border-radius: 13px;
      position: relative;
    }
    .mouse-icon::after {
      content: '';
      position: absolute;
      top: 5px;
      left: 50%;
      transform: translateX(-50%);
      width: 2px;
      height: 7px;
      background: #ffffff;
      border-radius: 2px;
    }

    /* BOTÓN DIRECTO PARA ABRIR EL EDITOR 3D */
    .btn-editor {
      background: linear-gradient(135deg, #7c3aed, #a855f7);
      color: #ffffff;
      border: none;
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 11px;
      font-weight: 600;
      font-family: 'Poppins', sans-serif;
      cursor: pointer !important;
      box-shadow: 0 4px 12px rgba(124, 58, 237, 0.4);
      transition: all 0.2s ease;
    }
    .btn-editor:hover {
      background: linear-gradient(135deg, #6d28d9, #9333ea);
      transform: scale(1.04);
    }
  </style>

  <script>
    // Función para activar el Inspector Visual sin teclas
    function activarEditorVisual() {
      if (window.AFRAME && window.AFRAME.INSPECTOR) {
        window.AFRAME.INSPECTOR.open();
      } else {
        window.postMessage('INJECT_AFRAME_INSPECTOR', '*');
      }
    }

    // Generador robusto de lienzos para obras de arte (compatibilidad garantizada)
    AFRAME.registerComponent('lienzo-obra', {
      schema: {
        titulo: { type: 'string', default: 'OBRA DISPONIBLE' },
        subtitulo: { type: 'string', default: 'Galería Nebulosa' },
        src: { type: 'string', default: '' }
      },
      init: function () {
        const el = this.el;
        const data = this.data;

        const aplicarTextura = (texture) => {
          texture.colorSpace = THREE.SRGBColorSpace;
          const mesh = el.getObject3D('mesh');
          if (mesh) {
            mesh.material = new THREE.MeshBasicMaterial({ 
              map: texture, 
              side: THREE.DoubleSide 
            });
            mesh.material.needsUpdate = true;
          }
        };

        if (data.src && data.src.trim() !== '') {
          const loader = new THREE.TextureLoader();
          loader.setCrossOrigin('anonymous');
          loader.load(
            data.src,
            function (tex) { aplicarTextura(tex); },
            undefined,
            function () { console.warn("Error cargando imagen: " + data.src); }
          );
          return;
        }

        const canvas = document.createElement('canvas');
        canvas.width = 1024;
        canvas.height = 720;
        const ctx = canvas.getContext('2d');

        const grad = ctx.createLinearGradient(0, 0, 1024, 720);
        grad.addColorStop(0, '#221538');
        grad.addColorStop(0.5, '#161026');
        grad.addColorStop(1, '#0c0a15');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.strokeStyle = '#c084fc';
        ctx.lineWidth = 8;
        ctx.strokeRect(30, 30, canvas.width - 60, canvas.height - 60);

        ctx.fillStyle = '#ffffff';
        ctx.font = "bold 52px 'Poppins', sans-serif";
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(data.titulo, canvas.width / 2, canvas.height / 2 - 35);

        ctx.fillStyle = '#e9d5ff';
        ctx.font = "400 30px 'Poppins', sans-serif";
        ctx.fillText(data.subtitulo, canvas.width / 2, canvas.height / 2 + 45);

        const texture = new THREE.CanvasTexture(canvas);
        aplicarTextura(texture);
      }
    });

    // Cuadro vertical de oro para los Ganadores de los Primeros Lugares
    AFRAME.registerComponent('cuadro-ganador', {
      schema: {
        titulo: { type: 'string', default: 'GANADORES DE LOS PRIMEROS LUGARES' },
        nombre: { type: 'string', default: 'Artistas Galardonados' }
      },
      init: function () {
        const el = this.el;
        const data = this.data;

        const canvas = document.createElement('canvas');
        canvas.width = 720;
        canvas.height = 1024;
        const ctx = canvas.getContext('2d');

        const fondo = ctx.createLinearGradient(0, 0, 720, 1024);
        fondo.addColorStop(0, '#2e1845');
        fondo.addColorStop(0.5, '#201230');
        fondo.addColorStop(1, '#170c24');
        ctx.fillStyle = fondo;
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.strokeStyle = '#f59e0b';
        ctx.lineWidth = 14;
        ctx.strokeRect(20, 20, canvas.width - 40, canvas.height - 40);

        ctx.strokeStyle = '#fbbf24';
        ctx.lineWidth = 4;
        ctx.strokeRect(40, 40, canvas.width - 80, canvas.height - 80);

        ctx.fillStyle = '#fbbf24';
        ctx.font = "bold 44px sans-serif";
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText("★   ★   ★", canvas.width / 2, 130);

        ctx.font = "bold 24px 'Poppins', sans-serif";
        ctx.fillStyle = "#fef3c7";
        ctx.fillText("RECONOCIMIENTO DE HONOR", canvas.width / 2, 210);

        ctx.beginPath();
        ctx.moveTo(120, 250);
        ctx.lineTo(600, 250);
        ctx.strokeStyle = '#f59e0b';
        ctx.lineWidth = 3;
        ctx.stroke();

        ctx.fillStyle = '#ffffff';
        ctx.font = "bold 30px 'Poppins', sans-serif";
        ctx.fillText("GANADORES DE LOS", canvas.width / 2, 335);
        ctx.font = "bold 34px 'Poppins', sans-serif";
        ctx.fillText("PRIMEROS LUGARES", canvas.width / 2, 380);

        ctx.font = "bold 105px sans-serif";
        ctx.fillStyle = '#fbbf24';
        ctx.fillText("★", canvas.width / 2, 510);

        ctx.fillStyle = '#fef08a';
        ctx.font = "bold 44px 'Poppins', sans-serif";
        ctx.fillText(data.nombre, canvas.width / 2, 650);

        ctx.fillStyle = '#e2e8f0';
        ctx.font = "400 26px 'Poppins', sans-serif";
        ctx.fillText("Galería Nebulosa", canvas.width / 2, 740);

        ctx.fillStyle = '#fbbf24';
        ctx.font = "bold 32px sans-serif";
        ctx.fillText("✦   ★   ✦", canvas.width / 2, 880);

        const texture = new THREE.CanvasTexture(canvas);
        texture.colorSpace = THREE.SRGBColorSpace;
        const mesh = el.getObject3D('mesh');
        if (mesh) {
          mesh.material = new THREE.MeshBasicMaterial({ 
            map: texture, 
            side: THREE.DoubleSide 
          });
          mesh.material.needsUpdate = true;
        }
      }
    });

    // Optimización de materiales y remoción física total de plantas
    AFRAME.registerComponent('enhancer', {
      init: function () {
        this.el.addEventListener('model-loaded', () => {
          const mesh = this.el.getObject3D('mesh');
          if (!mesh) return;

          const objetosParaEliminar = [];

          mesh.traverse((node) => {
            const matName = node.material && node.material.name ? node.material.name.toLowerCase() : "";
            const objName = node.name ? node.name.toLowerCase() : "";
            const combined = objName + " " + matName;

            const esVegetacion = combined.includes('plant') || combined.includes('leaf') || 
                                 combined.includes('leaves') || combined.includes('hoja') || 
                                 combined.includes('pot') || combined.includes('maceta') || 
                                 combined.includes('tree') || combined.includes('foliage') || 
                                 combined.includes('flora') || combined.includes('flower') || 
                                 combined.includes('branch') || combined.includes('vase');

            let tieneColorPlanta = false;
            if (node.material && node.material.color) {
              const c = node.material.color;
              if (c.g > 0.18 && c.g > c.r * 1.15 && c.g > c.b * 1.05) {
                tieneColorPlanta = true;
              }
            }

            if (esVegetacion || tieneColorPlanta) {
              objetosParaEliminar.push(node);
            }

            if (node.isMesh && node.material) {
              if (combined.includes('glass') || combined.includes('window') || combined.includes('vidrio') || combined.includes('cristal') || combined.includes('panel')) {
                node.material.color = new THREE.Color(0x22222b);
                node.material.transparent = true;
                node.material.opacity = 0.52;
                node.material.roughness = 0.20;
                node.material.metalness = 0.15;
                node.material.depthWrite = false;
              } 
              else if (combined.includes('light') || combined.includes('foco') || combined.includes('lamp') || combined.includes('spot') || combined.includes('bulb')) {
                node.material.emissive = new THREE.Color(0xffeedd);
                node.material.emissiveIntensity = 4.0;
              } 
              else if (combined.includes('floor') || combined.includes('suelo') || combined.includes('piso')) {
                node.material.color = new THREE.Color(0xd0d4de);
                node.material.roughness = 0.25;
                node.material.metalness = 0.08;
              } 
              else if (combined.includes('wall') || combined.includes('pared') || combined.includes('muro')) {
                node.material.color = new THREE.Color(0x584b70);
                node.material.roughness = 0.88;
                node.material.metalness = 0.02;
              }
              node.material.needsUpdate = true;
            }
          });

          objetosParaEliminar.forEach((obj) => {
            obj.visible = false;
            obj.scale.set(0, 0, 0);
            if (obj.geometry) obj.geometry.dispose();
            if (obj.parent) obj.parent.remove(obj);
          });
        });
      }
    });

    // Rótulo exterior Poppins
    AFRAME.registerComponent('rotulo-poppins', {
      init: function () {
        document.fonts.ready.then(() => {
          const canvas = document.createElement('canvas');
          canvas.width = 1024;
          canvas.height = 256;
          const ctx = canvas.getContext('2d');

          ctx.fillStyle = "rgba(18, 16, 30, 0.95)";
          ctx.fillRect(0, 0, canvas.width, canvas.height);

          ctx.strokeStyle = "rgba(230, 220, 255, 0.35)";
          ctx.lineWidth = 6;
          ctx.strokeRect(10, 10, canvas.width - 20, canvas.height - 20);

          ctx.font = "600 48px 'Poppins', sans-serif";
          ctx.fillStyle = "#ffffff";
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          ctx.fillText("«Donde cada arte brilla»", canvas.width / 2, canvas.height / 2);

          const texture = new THREE.CanvasTexture(canvas);
          const mat = new THREE.MeshBasicMaterial({ 
            map: texture, 
            transparent: true, 
            side: THREE.DoubleSide 
          });
          const mesh = this.el.getObject3D('mesh');
          if (mesh) mesh.material = mat;
        });
      }
    });

    // Control de video
    AFRAME.registerComponent('video-handler', {
      init: function () {
        const video = document.querySelector('#video-nebulosa');
        if (!video) return;

        video.playbackRate = 1.0;

        const startVideo = () => {
          if (video.paused) {
            video.playbackRate = 1.0;
            video.play().catch(() => {});
          }
          window.removeEventListener('click', startVideo);
          window.removeEventListener('keydown', startVideo);
        };
        window.addEventListener('click', startVideo);
        window.addEventListener('keydown', startVideo);
      }
    });
  </script>
</head>
<body style="margin: 0; overflow: hidden; background-color: #000;">
